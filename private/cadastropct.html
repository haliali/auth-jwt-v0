<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente</title>
    <!-- Importação do arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Cadastro de paciente</h1>
        <p>Preencha os dados abaixo para efetuar o cadastro</p>
    </div>

    <div class="form-card">
        <form action="#" method="POST">
            
            <!-- Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="form-group">
                    <label for="nome">Nome Completo do Paciente *</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite o nome completo">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento *</label>
                        <input type="date" id="data_nascimento" name="data_nascimento" required>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" maxlength="14" required placeholder="000.000.000-00">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cns">Cartão Nacional de Saúde (CNS) *</label>
                    <input type="text" id="cns" name="cns" maxlength="15" required placeholder="000 0000 0000 0000">
                </div>
            </fieldset>

            <!-- Filiação -->
            <fieldset>
                <legend>Filiação</legend>
                
                <div class="form-group">
                    <label for="nome_mae">Nome da Mãe *</label>
                    <input type="text" id="nome_mae" name="nome_mae" required placeholder="Digite o nome completo da mãe">
                </div>

                <div class="form-group">
                    <label for="nome_pai">Nome do Pai</label>
                    <input type="text" id="nome_pai" name="nome_pai" placeholder="Digite o nome completo do pai (opcional)">
                </div>
            </fieldset>

            <!-- Endereço e Contato -->
            <fieldset>
                <legend>Endereço e Contato</legend>
                
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label for="logradouro">Rua / Avenida (Endereço) *</label>
                        <input type="text" id="logradouro" name="logradouro" required placeholder="Ex: Av. Brasil">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" name="numero" required placeholder="Ex: 123">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" name="bairro" required placeholder="Digite o bairro">
                    </div>

                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Digite a cidade">
                    </div>

                    <div class="form-group" style="flex: 0.5;">
                        <label for="uf">UF *</label>
                        <input type="text" id="uf" name="uf" maxlength="2" required placeholder="SP">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000">
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone (com DDD) *</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(11) 99999-9999">
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Salvar</button>

        </form>
    </div>

    <div class="footer">
        &copy; 2026 Sistema de Saúde. Todos os direitos reservados.
    </div>
</div>

</body>
</html>
